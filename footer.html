<style>
    /* Footer Styles */
    .footer {
        background-color: #111827;
        color: white;
        padding: 3rem 1rem;
    }
    .footer-container {
        max-width: 1024px;
        margin: 0 auto;
        padding: 0 1rem;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2rem;
    }
    
    @media (min-width: 768px) {
        .footer-container {
            flex-direction: row;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 2rem;
            gap: 2rem;
        }
    }
    @media (min-width: 1024px) {
        .footer-container {
            padding: 0 3rem;
        }
    }

    .footer-links-group {
        display: flex;
        flex-direction: column;
        width: 100%;
        gap: 2rem;
    }

    @media (min-width: 768px) {
        .footer-links-group {
            flex-direction: row;
            justify-content: space-between;
        }
    }

    .footer-section {
        width: 100%;
        text-align: left;
    }

    @media (min-width: 768px) {
        .footer-section {
            width: calc(100% / 3);
        }
        .footer-section:nth-child(2) {
            text-align: left;
        }
        .footer-section:nth-child(3) {
            text-align: right;
        }
    }
    
    .footer-section h3 {
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        font-weight: 700;
        margin-bottom: 1rem;
    }
    .footer-section h4 {
        font-size: clamp(1.25rem, 3vw, 2rem);
        font-weight: 600;
        margin-bottom: 1rem;
    }
    .footer-section p {
        color: #9ca3af;
        font-size: 1rem;
    }

    .footer-links-list,
    .footer-legal-links-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
    }

    @media (min-width: 768px) {
        .footer-legal-links-list {
            align-items: flex-end;
        }
    }
    
    .footer-links-list a,
    .footer-social-links a,
    .footer-legal-links-list a {
        color: #9ca3af;
        transition: color 0.2s ease-in-out;
        font-size: 1rem;
    }
    .footer-links-list a:hover,
    .footer-social-links a:hover,
    .footer-legal-links-list a:hover {
        color: white;
    }

    .footer-social-links {
        display: flex;
        gap: 1rem;
        margin-bottom: 1rem;
        justify-content: flex-start;
    }
    
    @media (min-width: 768px) {
        .footer-social-links {
            justify-content: flex-end;
        }
    }

    .footer hr {
        border-color: #374151;
        margin: 2rem 0;
    }
    .footer-copyright {
        text-align: center;
        font-size: 1rem;
        color: #6b7280;
    }
</style>
